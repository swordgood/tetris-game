<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超级俄罗斯方块 - 在线版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start;
            min-height: 100vh; min-height: 100dvh;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            color: #eee; overflow-x: hidden; padding: 8px;
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        h1 {
            font-size: 1.5rem; color: #ffd700;
            text-shadow: 0 0 15px rgba(255,215,0,0.4);
            letter-spacing: 2px; margin-bottom: 6px;
        }
        .subtitle { font-size: 0.8rem; color: #888; margin-bottom: 8px; text-align: center; }

        .top-bar {
            display: flex; gap: 8px; align-items: center;
            margin-bottom: 8px; flex-wrap: wrap; justify-content: center;
        }
        .top-bar .top-btn {
            padding: 6px 14px; font-size: 0.85rem; border: none; border-radius: 20px;
            cursor: pointer; background: rgba(0,212,255,0.15);
            color: #00d4ff; border: 1px solid rgba(0,212,255,0.3);
            transition: all 0.3s;
        }
        .top-bar .top-btn:hover { background: rgba(0,212,255,0.3); }
        .top-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .mobile-info {
            display: none; gap: 12px; justify-content: center;
            margin-bottom: 6px; font-size: 0.85rem; flex-wrap: wrap;
        }
        .mobile-info span { color: #aaa; }
        .mobile-info b { color: #ffd700; margin-left: 2px; }

        .game-wrapper {
            display: flex; gap: 15px; align-items: flex-start;
            justify-content: center;
        }
        .canvas-wrapper {
            position: relative; display: flex; flex-direction: column; align-items: center;
            touch-action: none;
        }

        #gameCanvas {
            border: 2px solid rgba(0,212,255,0.4);
            border-radius: 8px; background: #0a0a1a;
            box-shadow: 0 0 25px rgba(0,212,255,0.15);
            max-width: 100vw; max-height: 60vh;
        }

        .corner-btn {
            position: absolute; top: 6px;
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.5); color: #fff;
            cursor: pointer; font-size: 0.9rem; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s;
        }
        .corner-btn:hover { background: rgba(255,255,255,0.2); }

        .side-panel {
            display: flex; flex-direction: column; gap: 8px;
            width: 155px;
        }
        .panel-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,212,255,0.25);
            border-radius: 10px; padding: 8px;
        }
        .panel-box h3 {
            font-size: 0.75rem; color: #aaa;
            margin-bottom: 4px; text-align: center;
        }
        .panel-box .value {
            font-size: 1.3rem; text-align: center;
            color: #ffd700; font-weight: bold;
        }
        #nextCanvas { display: block; margin: 0 auto; border-radius: 4px; }
        .btn {
            padding: 8px 12px; font-size: 0.9rem; border: none; border-radius: 8px;
            cursor: pointer; background: #00d4ff; color: #1a1a2e;
            font-weight: bold; transition: all 0.3s; width: 100%;
        }
        .btn:hover { background: #33ddff; transform: translateY(-1px); }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }
        .btn.btn-green { background: #25d366; color: #fff; }
        .btn.btn-green:hover { background: #22bf5b; }

        .energy-bar-container {
            width: 100%; height: 14px;
            background: rgba(0,0,0,0.4); border-radius: 7px;
            overflow: hidden; border: 1px solid rgba(255,255,255,0.08);
        }
        .energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #ffd700);
            border-radius: 7px; transition: width 0.3s;
        }
        .skills { display: flex; flex-direction: column; gap: 4px; }
        .skill-btn {
            padding: 6px; font-size: 0.75rem;
            border: 1px solid rgba(0,212,255,0.3); border-radius: 6px;
            cursor: pointer; background: rgba(0,212,255,0.08);
            color: #fff; font-weight: bold; transition: all 0.3s;
            display: flex; align-items: center; justify-content: space-between;
        }
        .skill-btn:hover:not(:disabled) { background: rgba(0,212,255,0.2); }
        .skill-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .skill-key {
            background: rgba(255,255,255,0.1); border-radius: 3px;
            padding: 0px 4px; font-size: 0.65rem; color: #ffd700;
        }

        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
            border-radius: 8px;
        }
        #overlay.hidden { display: none; }
        #overlay h2 { font-size: 1.8rem; color: #ff4757; margin-bottom: 10px; }
        #overlay .final-score { font-size: 1.1rem; margin-bottom: 15px; color: #ffd700; }

        .level-display { color: #00d4ff !important; }
        .combo-display { color: #ff6b9d !important; }

        .combo-text {
            position: fixed; font-size: 1.6rem; font-weight: bold;
            color: #ff6b9d; text-shadow: 0 0 15px rgba(255,107,157,0.8);
            pointer-events: none; animation: comboAnim 1s ease-out forwards;
            z-index: 100;
        }
        @keyframes comboAnim {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            50% { opacity: 1; transform: translateY(-25px) scale(1.15); }
            100% { opacity: 0; transform: translateY(-50px) scale(0.85); }
        }
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .controls-desktop {
            margin-top: 10px; text-align: center;
            color: #888; font-size: 0.78rem; line-height: 1.7;
        }
        .controls-desktop kbd {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 3px; padding: 1px 4px; font-family: monospace; color: #bbb;
        }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); display: flex;
            align-items: center; justify-content: center; z-index: 200;
            backdrop-filter: blur(4px);
        }
        .modal.hidden { display: none !important; }
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid rgba(0,212,255,0.3);
            border-radius: 16px; padding: 24px;
            max-width: 90vw; width: 400px;
            max-height: 85vh; overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .modal-content h3 {
            text-align: center; color: #ffd700;
            margin-bottom: 16px; font-size: 1.3rem;
        }
        .modal-content p { color: #aaa; font-size: 0.9rem; margin-bottom: 10px; text-align: center; }
        .modal .btn { margin-top: 12px; }
        .modal input[type="text"] {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            border: 1px solid rgba(0,212,255,0.3); background: rgba(0,0,0,0.3);
            color: #fff; font-size: 1rem; outline: none;
        }
        .modal input[type="text"]:focus { border-color: #00d4ff; }

        .leaderboard-list {
            max-height: 300px; overflow-y: auto; margin-bottom: 12px;
        }
        .lb-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 8px; margin-bottom: 4px;
            background: rgba(255,255,255,0.03); font-size: 0.9rem;
        }
        .lb-item:nth-child(1) { background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.2); }
        .lb-item:nth-child(2) { background: rgba(192,192,192,0.08); border: 1px solid rgba(192,192,192,0.15); }
        .lb-item:nth-child(3) { background: rgba(205,127,50,0.08); border: 1px solid rgba(205,127,50,0.15); }
        .lb-rank { width: 28px; text-align: center; font-weight: bold; color: #00d4ff; }
        .lb-name { flex: 1; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-score { color: #ffd700; font-weight: bold; }
        .lb-date { font-size: 0.7rem; color: #666; margin-left: 4px; white-space: nowrap; }
        .name-input { display: flex; gap: 8px; margin-bottom: 8px; }
        .name-input input { flex: 1; }
        .name-input button { width: auto; padding: 8px 16px; }
        .lb-empty { text-align: center; color: #666; padding: 20px; }
        .lb-source { text-align: center; font-size: 0.75rem; color: #666; margin-top: 4px; }
        .lb-source .online { color: #00d4ff; }
        .lb-source .local { color: #888; }

        .share-link-box {
            display: flex; gap: 8px; margin: 12px 0;
        }
        .share-link-box input {
            flex: 1; font-size: 0.85rem; padding: 10px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            color: #ddd; border-radius: 8px;
        }
        .share-link-box button {
            width: auto; padding: 8px 16px; white-space: nowrap;
        }
        .share-native-btn {
            width: 100%; padding: 10px; margin-bottom: 10px;
            background: #25d366; color: #fff; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            font-size: 1rem;
        }
        .share-native-btn:hover { background: #22bf5b; }
        .share-or { text-align: center; color: #666; font-size: 0.8rem; margin: 8px 0; }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px; margin-top: 8px; max-width: 340px; width: 100%;
            touch-action: none;
        }
        .mob-btn {
            padding: 14px 4px; font-size: 1.2rem;
            border: 1px solid rgba(0,212,255,0.25);
            border-radius: 10px; background: rgba(0,212,255,0.08);
            color: #fff; cursor: pointer; touch-action: manipulation;
            user-select: none; -webkit-user-select: none;
            transition: all 0.1s;
        }
        .mob-btn:active { background: rgba(0,212,255,0.3); transform: scale(0.95); }
        .mob-btn.skill { font-size: 0.95rem; padding: 10px 2px; }
        .mob-btn.disabled-skill { opacity: 0.35; }

        .global-badge {
            display: inline-block; background: #00d4ff; color: #000;
            font-size: 0.65rem; padding: 1px 5px; border-radius: 4px;
            font-weight: bold; margin-left: 4px; vertical-align: middle;
        }

        @media (max-width: 600px) {
            body { padding: 4px; justify-content: center; }
            h1 { font-size: 1.2rem; margin-bottom: 4px; }
            .game-wrapper { gap: 8px; }
            .side-panel { display: none; }
            .mobile-info { display: flex; }
            .mobile-controls { display: grid; }
            .controls-desktop { display: none; }
            .top-bar { margin-bottom: 4px; }
            #gameCanvas {
                width: min(92vw, 280px) !important;
                height: auto !important;
            }
            .modal-content { padding: 16px; width: 92vw; }
        }
        @media (min-width: 601px) {
            .mobile-info { display: none !important; }
            .mobile-controls { display: none !important; }
        }
    </style>
</head>
<body>
    <h1>超级俄罗斯方块</h1>
    <p class="subtitle">在线版 · 支持全球排行榜 <span class="global-badge" id="connBadge">本地模式</span></p>

    <div class="top-bar">
        <button class="top-btn" id="rankBtnTop">🏆 排行榜</button>
        <button class="top-btn" id="shareBtnTop">📤 分享</button>
        <button class="top-btn" id="audioBtnTop">🔊 音效</button>
    </div>

    <div class="mobile-info" id="mobileInfo">
        <span>得分<b id="mScore">0</b></span>
        <span>等级<b id="mLevel">1</b></span>
        <span>连击<b id="mCombo">x1</b></span>
        <span>消除<b id="mLines">0</b></span>
    </div>

    <div class="game-wrapper">
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            <div id="overlay">
                <h2 id="overlayTitle">游戏结束</h2>
                <div class="final-score">最终得分: <span id="finalScore">0</span></div>
                <button class="btn" id="startBtn" style="width:auto;padding:10px 32px;">开始游戏</button>
            </div>
        </div>

        <div class="side-panel" id="desktopPanel">
            <div class="panel-box">
                <h3>下一个</h3>
                <canvas id="nextCanvas" width="100" height="80"></canvas>
            </div>
            <div class="panel-box">
                <h3>⚡ 能量</h3>
                <div class="energy-bar-container">
                    <div class="energy-bar" id="energyBar" style="width:0%"></div>
                </div>
            </div>
            <div class="panel-box">
                <h3>🔥 技能</h3>
                <div class="skills">
                    <button class="skill-btn" id="skillBomb" disabled>💣 炸弹 <span class="skill-key">Z</span></button>
                    <button class="skill-btn" id="skillFreeze" disabled>❄️ 冻结 <span class="skill-key">X</span></button>
                    <button class="skill-btn" id="skillGravity" disabled>🔄 重力 <span class="skill-key">C</span></button>
                </div>
            </div>
            <div class="panel-box"><h3>得分</h3><div class="value" id="score">0</div></div>
            <div class="panel-box"><h3>连击</h3><div class="value combo-display" id="combo">x1</div></div>
            <div class="panel-box"><h3>等级</h3><div class="value level-display" id="level">1</div></div>
            <div class="panel-box"><h3>消除</h3><div class="value" id="lines">0</div></div>
            <div class="panel-box"><h3>最高分</h3><div class="value" id="highScore">0</div></div>
            <button class="btn" id="pauseBtn">暂停</button>
        </div>
    </div>

    <div class="mobile-controls" id="mobileControls">
        <button class="mob-btn" data-action="rotate">🔄 旋转</button>
        <button class="mob-btn" data-action="left">⬅️ 左</button>
        <button class="mob-btn" data-action="right">➡️ 右</button>
        <button class="mob-btn" data-action="down">⬇️ 下</button>
        <button class="mob-btn" data-action="drop">⬇️⬇️ 落底</button>
        <button class="mob-btn skill" data-action="skill-bomb" id="mobBomb">💣</button>
        <button class="mob-btn skill" data-action="skill-freeze" id="mobFreeze">❄️</button>
        <button class="mob-btn skill" data-action="skill-gravity" id="mobGravity">🌍</button>
    </div>

    <div class="controls-desktop">
        <p><kbd>←</kbd> <kbd>→</kbd> 移动　<kbd>↑</kbd> 旋转　<kbd>↓</kbd> 加速　<kbd>空格</kbd> 落底　<kbd>P</kbd> 暂停</p>
        <p>技能: <kbd>Z</kbd> 炸弹 <kbd>X</kbd> 冻结 <kbd>C</kbd> 重力翻转</p>
        <p>💣炸弹炸3x3 🌈彩虹消整行 ❄️冰冻暂停2秒</p>
    </div>

    <!-- 排行榜弹窗 -->
    <div class="modal hidden" id="rankModal">
        <div class="modal-content">
            <h3>🏆 排行榜</h3>
            <div class="leaderboard-list" id="leaderboardList"></div>
            <p class="lb-source" id="lbSource"><span class="local">本地排行（仅本设备可见）</span></p>
            <div class="name-input">
                <input type="text" id="playerNameInput" placeholder="输入你的昵称" maxlength="10">
                <button class="btn" id="saveNameBtn">保存</button>
            </div>
            <button class="btn" id="closeRank">关闭</button>
        </div>
    </div>

    <!-- 分享弹窗 -->
    <div class="modal hidden" id="shareModal">
        <div class="modal-content">
            <h3>📤 分享给好友</h3>
            <p>挑战你的好友来打破纪录！</p>
            <button class="share-native-btn" id="nativeShareBtn">📲 一键分享</button>
            <div class="share-or">— 或复制链接 —</div>
            <div class="share-link-box">
                <input type="text" id="shareLinkInput" readonly>
                <button class="btn" id="copyLinkBtn">复制</button>
            </div>
            <button class="btn" id="closeShare">关闭</button>
        </div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div class="modal hidden" id="gameOverModal">
        <div class="modal-content">
            <h3>🎮 游戏结束</h3>
            <p style="font-size:1.2rem;color:#ffd700;margin-bottom:4px;">得分: <b id="goScore">0</b></p>
            <p style="font-size:0.9rem;color:#aaa;margin-bottom:12px;">等级: <span id="goLevel">1</span>　消除: <span id="goLines">0</span></p>
            <div class="leaderboard-list" id="goLeaderboard" style="max-height:180px;"></div>
            <div class="name-input">
                <input type="text" id="goNameInput" placeholder="输入昵称保存成绩" maxlength="10">
                <button class="btn" id="goSaveBtn">保存</button>
            </div>
            <button class="btn" id="goRestartBtn">再玩一次</button>
            <button class="btn btn-green" id="goShareBtn">📤 分享成绩</button>
        </div>
    </div>

<script type="module">
// ========================================================================
// 配置区域：填入你的 Firebase 配置即可启用全球排行榜
// 不填也能玩，排行榜只在本地保存
// ========================================================================
const FIREBASE_CONFIG = {
    // apiKey: "你的_apiKey",
    // authDomain: "你的_projectId.firebaseapp.com",
    // databaseURL: "https://你的_projectId-default-rtdb.firebaseio.com",
    // projectId: "你的_projectId",
    // storageBucket: "你的_projectId.appspot.com",
    // messagingSenderId: "你的_senderId",
    // appId: "你的_appId"
};

// ========================================================================
// Firebase 全球排行榜模块（动态导入，未配置则自动回退本地）
// ========================================================================
let fbApp = null;
let fbDb = null;
let onlineMode = false;
let leaderboardCache = [];
let leaderboardUnsub = null;

async function initFirebase() {
    if (!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.includes('你的')) {
        return false;
    }
    try {
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
        const { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js');
        fbApp = initializeApp(FIREBASE_CONFIG);
        fbDb = getDatabase(fbApp);
        onlineMode = true;

        // 实时监听排行榜
        const q = query(ref(fbDb, 'leaderboard'), orderByChild('score'), limitToLast(20));
        leaderboardUnsub = onValue(q, (snapshot) => {
            const data = [];
            snapshot.forEach((child) => data.push(child.val()));
            data.sort((a, b) => b.score - a.score);
            leaderboardCache = data;
            updateConnectionBadge(true);
        });
        return true;
    } catch (e) {
        console.warn('Firebase 初始化失败，回退到本地模式:', e);
        onlineMode = false;
        return false;
    }
}

async function submitScoreOnline(entry) {
    if (!onlineMode || !fbDb) return false;
    try {
        const { ref, push } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js');
        await push(ref(fbDb, 'leaderboard'), {
            name: entry.name || '匿名',
            score: entry.score,
            lines: entry.lines,
            level: entry.level,
            date: Date.now()
        });
        return true;
    } catch (e) {
        console.warn('提交分数失败:', e);
        return false;
    }
}

function updateConnectionBadge(connected) {
    const badge = document.getElementById('connBadge');
    if (!badge) return;
    if (connected) {
        badge.textContent = '全球在线';
        badge.style.background = '#00d4ff';
    } else {
        badge.textContent = '本地模式';
        badge.style.background = '#666';
    }
}

// ========================================================================
// 本地排行榜（Firebase 未配置时的回退）
// ========================================================================
const LocalBoard = {
    KEY: 'tetrisLeaderboard_v4',
    NAME_KEY: 'tetrisPlayerName_v4',
    getAll() {
        try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch { return []; }
    },
    add(entry) {
        const list = this.getAll();
        list.push({ ...entry, date: Date.now() });
        list.sort((a, b) => b.score - a.score);
        localStorage.setItem(this.KEY, JSON.stringify(list.slice(0, 50)));
        return list;
    },
    getTop(n = 20) {
        return this.getAll().slice(0, n);
    },
    getPlayerName() {
        return localStorage.getItem(this.NAME_KEY) || '';
    },
    setPlayerName(name) {
        localStorage.setItem(this.NAME_KEY, name.trim());
    }
};

// ========================================================================
// 排行榜渲染
// ========================================================================
function escapeHtml(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function formatDate(ts) {
    const d = new Date(ts);
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function getLeaderboardData() {
    if (onlineMode && leaderboardCache.length > 0) {
        return leaderboardCache;
    }
    return LocalBoard.getTop(20);
}

function renderLeaderboard(containerId, highlightScore) {
    const container = document.getElementById(containerId);
    const list = getLeaderboardData();
    const sourceEl = document.getElementById('lbSource');
    if (sourceEl) {
        sourceEl.innerHTML = onlineMode
            ? '<span class="online">🌐 全球排行榜（实时）</span>'
            : '<span class="local">📱 本地排行（仅本设备可见）</span>';
    }
    if (list.length === 0) {
        container.innerHTML = '<div class="lb-empty">暂无记录，快来挑战吧！</div>';
        return;
    }
    container.innerHTML = list.map((e, i) => {
        const isHighlight = highlightScore && e.score === highlightScore;
        const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
        const style = isHighlight ? 'style="border:1px solid #ffd700;box-shadow:0 0 10px rgba(255,215,0,0.2);"' : '';
        return `<div class="lb-item" ${style}>
            <span class="lb-rank">${medal}${i+1}</span>
            <span class="lb-name">${escapeHtml(e.name || '匿名')}</span>
            <span class="lb-score">${e.score}</span>
            <span class="lb-date">${formatDate(e.date)}</span>
        </div>`;
    }).join('');
}

const AudioSys = {
    ctx: null, bgmGain: null, sfxGain: null,
    enabled: true, bgmPlaying: false,
    nextNoteTime: 0, bgmInterval: null,
    tempo: 0.32, beatIndex: 0,

    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.bgmGain = this.ctx.createGain();
            this.bgmGain.gain.value = 0.035;
            this.bgmGain.connect(this.ctx.destination);
            this.sfxGain = this.ctx.createGain();
            this.sfxGain.gain.value = 0.25;
            this.sfxGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
    },
    toggle() {
        this.enabled = !this.enabled;
        if (this.enabled) {
            this.init();
            if (!this.bgmPlaying) this.startBGM();
            this.bgmGain.gain.setValueAtTime(0.035, this.ctx.currentTime);
        } else {
            if (this.bgmGain) this.bgmGain.gain.setValueAtTime(0, this.ctx.currentTime);
        }
        return this.enabled;
    },
    playTone(freq, duration, type = 'square', detune = 0, when = null, target = 'sfx') {
        if (!this.enabled || !this.ctx) return;
        const t = when !== null ? when : this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (detune) osc.detune.setValueAtTime(detune, t);
        gain.gain.setValueAtTime(0.25, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain);
        gain.connect(target === 'bgm' ? this.bgmGain : this.sfxGain);
        osc.start(t); osc.stop(t + duration);
    },
    sfxMove() { this.playTone(220, 0.05, 'triangle'); },
    sfxRotate() {
        this.playTone(440, 0.08, 'sine');
        this.playTone(660, 0.08, 'sine', 0, this.ctx.currentTime + 0.03);
    },
    sfxDrop() {
        this.playTone(150, 0.15, 'sawtooth');
        this.playTone(100, 0.2, 'sawtooth', 0, this.ctx.currentTime + 0.05);
    },
    sfxClear(lines) {
        const base = lines === 4 ? 523 : lines === 3 ? 440 : lines === 2 ? 349 : 262;
        for (let i = 0; i < 4; i++) {
            this.playTone(base * (1 + i * 0.25), 0.12, 'square', 0, this.ctx.currentTime + i * 0.06);
        }
    },
    sfxCombo() {
        this.playTone(523, 0.1, 'square');
        this.playTone(659, 0.1, 'square', 0, this.ctx.currentTime + 0.08);
        this.playTone(784, 0.15, 'square', 0, this.ctx.currentTime + 0.16);
    },
    sfxSkill() {
        for (let i = 0; i < 6; i++) {
            this.playTone(200 + i * 80, 0.1, 'sawtooth', 0, this.ctx.currentTime + i * 0.04);
        }
    },
    sfxGameOver() {
        [440, 415, 392, 370, 349, 330, 311, 294].forEach((n, i) => {
            this.playTone(n, 0.3, 'sawtooth', 0, this.ctx.currentTime + i * 0.15);
        });
    },
    sfxSpecial() {
        this.playTone(880, 0.1, 'sine');
        this.playTone(1100, 0.15, 'sine', 0, this.ctx.currentTime + 0.05);
        this.playTone(1320, 0.2, 'sine', 0, this.ctx.currentTime + 0.1);
    },
    sfxWarning() {
        this.playTone(200, 0.3, 'sawtooth');
        this.playTone(180, 0.3, 'sawtooth', 0, this.ctx.currentTime + 0.15);
    },
    bgmNotes: [
         0,  4,  7, 12,  7,  4,  0, -3,
         0,  4,  7,  4,  0, -3, -5, -7,
        -3,  0,  4,  7, 12,  7,  4,  0,
         4,  7, 12,  7,  4,  0, -3, -5,
    ],
    bgmBass: [
        -12, -12, -12, -12, -12, -12, -12, -12,
        -17, -17, -17, -17, -19, -19, -19, -19,
        -12, -12, -12, -12, -12, -12, -12, -12,
        -15, -15, -15, -15, -12, -12, -12, -12,
    ],
    startBGM() {
        if (this.bgmPlaying || !this.enabled) return;
        this.init();
        this.bgmPlaying = true;
        this.beatIndex = 0;
        this.nextNoteTime = this.ctx.currentTime + 0.1;
        this.scheduleBGM();
    },
    scheduleBGM() {
        if (!this.bgmPlaying) return;
        while (this.nextNoteTime < this.ctx.currentTime + 0.5) {
            this.playBGMBeat(this.nextNoteTime);
            this.nextNoteTime += this.tempo;
            this.beatIndex = (this.beatIndex + 1) % this.bgmNotes.length;
        }
        this.bgmInterval = requestAnimationFrame(() => this.scheduleBGM());
    },
    playBGMBeat(t) {
        if (!this.enabled) return;
        const note = this.bgmNotes[this.beatIndex];
        const bass = this.bgmBass[this.beatIndex];
        const bf = 261.63 * Math.pow(2, bass / 12);
        this.playTone(bf, this.tempo * 2.0, 'sine', 0, t, 'bgm');
        const mf = 261.63 * Math.pow(2, note / 12);
        this.playTone(mf, this.tempo * 1.6, 'sine', 2, t + 0.03, 'bgm');
    },
    stopBGM() {
        this.bgmPlaying = false;
        if (this.bgmInterval) { cancelAnimationFrame(this.bgmInterval); this.bgmInterval = null; }
    }
};

// ========================================================================
// 粒子系统
// ========================================================================
class ParticleSystem {
    constructor() { this.particles = []; this.poolSize = 300; }
    emit(x, y, color, count = 6) {
        for (let i = 0; i < count; i++) {
            if (this.particles.length >= this.poolSize) break;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                life: 1, decay: 0.02 + Math.random() * 0.03,
                color, size: Math.random() * 3 + 2, grav: 0.15
            });
        }
    }
    update() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life -= p.decay;
            if (p.life <= 0) {
                this.particles[i] = this.particles[this.particles.length - 1];
                this.particles.pop();
            }
        }
    }
    draw(ctx) {
        for (const p of this.particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
    clear() { this.particles = []; }
}
const particleSys = new ParticleSystem();

// ========================================================================
// 游戏逻辑
// ========================================================================
function createBoard() {
    board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
    boardSpecial = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
}
function getRandomPiece() { return PIECE_NAMES[Math.floor(Math.random() * PIECE_NAMES.length)]; }
function getSpecialChance() { return Math.min(0.06 + (level - 1) * 0.015, 0.22); }
function getRandomSpecial() {
    const r = Math.random();
    if (r < 0.33) return SPECIAL_BLOCKS.BOMB;
    if (r < 0.66) return SPECIAL_BLOCKS.RAINBOW;
    return SPECIAL_BLOCKS.ICE;
}

function spawnPiece() {
    const name = nextPieceName || getRandomPiece();
    const special = nextPieceSpecial;
    nextPieceName = getRandomPiece();
    nextPieceSpecial = Math.random() < getSpecialChance() ? getRandomSpecial() : null;
    drawNext();
    const pieceData = SHAPES[name];
    currentPiece = {
        name,
        x: Math.floor(COLS/2) - Math.floor(pieceData.shapes[0][0].length/2),
        y: 0, rotation: 0, color: pieceData.color, special
    };
    if (!isValidPosition(currentPiece.x, currentPiece.y, currentPiece.rotation)) {
        gameOver(); return false;
    }
    return true;
}
function getShape(piece) { return SHAPES[piece.name].shapes[piece.rotation]; }
function isValidPosition(x, y, rotation) {
    const shape = SHAPES[currentPiece.name].shapes[rotation];
    for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
            if (shape[row][col]) {
                const nx = x + col, ny = y + row;
                if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
                if (ny >= 0 && board[ny][nx]) return false;
            }
        }
    }
    return true;
}

function lockPiece() {
    const shape = getShape(currentPiece);
    const specialCells = [];
    for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
            if (shape[row][col]) {
                const y = currentPiece.y + row, x = currentPiece.x + col;
                if (y >= 0) {
                    board[y][x] = currentPiece.color;
                    if (currentPiece.special) {
                        boardSpecial[y][x] = currentPiece.special;
                        specialCells.push({x, y, special: currentPiece.special});
                    }
                }
            }
        }
    }
    AudioSys.sfxDrop();
    handleSpecialEffects(specialCells);
}

function handleSpecialEffects(cells) {
    for (const cell of cells) {
        const {x, y, special} = cell;
        AudioSys.sfxSpecial();
        if (special.type === 'bomb') {
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    const nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        board[ny][nx] = 0; boardSpecial[ny][nx] = null;
                        particleSys.emit(nx * BLOCK_SIZE + BLOCK_SIZE/2, ny * BLOCK_SIZE + BLOCK_SIZE/2, '#ff4757', 4);
                    }
                }
            }
            score += 50;
            canvasWrapper.classList.add('shake');
            setTimeout(() => canvasWrapper.classList.remove('shake'), 400);
        } else if (special.type === 'rainbow') {
            for (let c = 0; c < COLS; c++) {
                board[y][c] = 0; boardSpecial[y][c] = null;
                particleSys.emit(c * BLOCK_SIZE + BLOCK_SIZE/2, y * BLOCK_SIZE + BLOCK_SIZE/2, '#e056fd', 3);
            }
            score += 100;
        } else if (special.type === 'ice') {
            isFrozen = true;
            if (frozenTimer) clearTimeout(frozenTimer);
            frozenTimer = setTimeout(() => { isFrozen = false; }, 2000);
        }
    }
}

function showComboText(text, color) {
    const el = document.createElement('div');
    el.className = 'combo-text';
    el.textContent = text; el.style.color = color;
    const rect = canvas.getBoundingClientRect();
    el.style.left = (rect.left + rect.width/2 - 50) + 'px';
    el.style.top = (rect.top + rect.height/2 - 20) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function clearLines() {
    let linesCleared = 0;
    for (let row = ROWS - 1; row >= 0; row--) {
        if (board[row].every(cell => cell !== 0)) {
            for (let c = 0; c < COLS; c++) {
                particleSys.emit(c * BLOCK_SIZE + BLOCK_SIZE/2, row * BLOCK_SIZE + BLOCK_SIZE/2, board[row][c], 5);
            }
            board.splice(row, 1); board.unshift(Array(COLS).fill(0));
            boardSpecial.splice(row, 1); boardSpecial.unshift(Array(COLS).fill(null));
            linesCleared++; row++;
        }
    }
    if (linesCleared > 0) {
        lines += linesCleared;
        combo++;
        if (comboTimer) clearTimeout(comboTimer);
        comboTimer = setTimeout(() => { combo = 0; updateUI(); }, 2500);
        const comboMultiplier = Math.min(combo, 10);
        const basePoints = [0, 100, 300, 600, 1000];
        score += basePoints[linesCleared] * level * comboMultiplier;
        energy = Math.min(energy + linesCleared * 15 + combo * 5, maxEnergy);
        AudioSys.sfxClear(linesCleared);
        if (combo >= 2) { showComboText(`连击 x${comboMultiplier}!`, '#ff6b9d'); AudioSys.sfxCombo(); }
        if (linesCleared === 4) { showComboText('完美消除!', '#ffd700'); energy = Math.min(energy + 20, maxEnergy); }
        const newLevel = Math.floor(lines / 10) + 1;
        if (newLevel > level) {
            level = newLevel;
            dropInterval = Math.max(80, 1000 - (level - 1) * 80);
            showComboText(`升级到 ${level}级!`, '#00d4ff');
            if (level % 5 === 0) addObstacleRow();
        }
        updateUI();
    } else {
        if (comboTimer) { clearTimeout(comboTimer); comboTimer = setTimeout(() => { combo = 0; updateUI(); }, 2500); }
    }
}

function addObstacleRow() {
    board.shift(); board.push(Array(COLS).fill('#555'));
    boardSpecial.shift(); boardSpecial.push(Array(COLS).fill(null));
    for (let i = 0; i < 3; i++) board[ROWS - 1][Math.floor(Math.random() * COLS)] = 0;
    showComboText('障碍行来袭!', '#ff4757');
    AudioSys.sfxWarning();
    canvasWrapper.classList.add('shake');
    setTimeout(() => canvasWrapper.classList.remove('shake'), 400);
}

function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
    document.getElementById('lines').textContent = lines;
    document.getElementById('combo').textContent = 'x' + Math.min(combo || 1, 10);
    energyBar.style.width = (energy / maxEnergy * 100) + '%';
    document.getElementById('skillBomb').disabled = energy < 40;
    document.getElementById('skillFreeze').disabled = energy < 30;
    document.getElementById('skillGravity').disabled = energy < 50;
    document.getElementById('mScore').textContent = score;
    document.getElementById('mLevel').textContent = level;
    document.getElementById('mCombo').textContent = 'x' + Math.min(combo || 1, 10);
    document.getElementById('mLines').textContent = lines;
    const mobBomb = document.getElementById('mobBomb');
    const mobFreeze = document.getElementById('mobFreeze');
    const mobGravity = document.getElementById('mobGravity');
    if (mobBomb) mobBomb.classList.toggle('disabled-skill', energy < 40);
    if (mobFreeze) mobFreeze.classList.toggle('disabled-skill', energy < 30);
    if (mobGravity) mobGravity.classList.toggle('disabled-skill', energy < 50);
    if (score > highScore) {
        highScore = score;
        document.getElementById('highScore').textContent = highScore;
        localStorage.setItem('superTetrisHighScore_v4', highScore);
    }
}

function movePiece(dx, dy) {
    if (!currentPiece || isPaused || isGameOver || isFrozen) return false;
    const nx = currentPiece.x + dx, ny = currentPiece.y + dy;
    if (isValidPosition(nx, ny, currentPiece.rotation)) {
        currentPiece.x = nx; currentPiece.y = ny;
        if (dx !== 0) AudioSys.sfxMove();
        return true;
    }
    return false;
}
function rotatePiece() {
    if (!currentPiece || isPaused || isGameOver || isFrozen) return;
    const nr = (currentPiece.rotation + 1) % 4;
    if (isValidPosition(currentPiece.x, currentPiece.y, nr)) {
        currentPiece.rotation = nr;
    } else if (isValidPosition(currentPiece.x - 1, currentPiece.y, nr)) {
        currentPiece.x -= 1; currentPiece.rotation = nr;
    } else if (isValidPosition(currentPiece.x + 1, currentPiece.y, nr)) {
        currentPiece.x += 1; currentPiece.rotation = nr;
    }
    AudioSys.sfxRotate();
}
let isDropping = false;
function hardDrop() {
    if (isDropping || !currentPiece || isPaused || isGameOver || isFrozen) return;
    isDropping = true;
    let dist = 0;
    while (movePiece(0, 1)) dist++;
    score += dist * 2;
    lockPiece(); clearLines(); spawnPiece();
    updateUI();
    isDropping = false;
}

function useSkillBomb() {
    if (energy < 40 || isPaused || isGameOver) return;
    energy -= 40; AudioSys.sfxSkill();
    for (let r = ROWS - 1; r >= ROWS - 5 && r >= 0; r--) {
        for (let c = 0; c < COLS; c++) {
            if (board[r][c]) {
                particleSys.emit(c * BLOCK_SIZE + BLOCK_SIZE/2, r * BLOCK_SIZE + BLOCK_SIZE/2, '#ff4757', 6);
                board[r][c] = 0; boardSpecial[r][c] = null;
            }
        }
    }
    score += 200;
    showComboText('清屏炸弹!', '#ff4757');
    canvasWrapper.classList.add('shake');
    setTimeout(() => canvasWrapper.classList.remove('shake'), 400);
    updateUI();
}
function useSkillFreeze() {
    if (energy < 30 || isPaused || isGameOver) return;
    energy -= 30; AudioSys.sfxSkill();
    isFrozen = true;
    if (frozenTimer) clearTimeout(frozenTimer);
    frozenTimer = setTimeout(() => { isFrozen = false; }, 5000);
    showComboText('时间冻结 5秒!', '#74b9ff');
    updateUI();
}
function useSkillGravity() {
    if (energy < 50 || isPaused || isGameOver) return;
    energy -= 50; AudioSys.sfxSkill();
    for (let c = 0; c < COLS; c++) {
        let wr = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
            if (board[r][c]) {
                const color = board[r][c], spec = boardSpecial[r][c];
                board[r][c] = 0; boardSpecial[r][c] = null;
                board[wr][c] = color; boardSpecial[wr][c] = spec;
                wr--;
            }
        }
    }
    clearLines(); score += 300;
    showComboText('重力翻转!', '#00d4ff');
    canvasWrapper.classList.add('shake');
    setTimeout(() => canvasWrapper.classList.remove('shake'), 400);
    updateUI();
}

// ========================================================================
// 游戏 & 渲染循环
// ========================================================================
function gameLogicLoop(timestamp) {
    if (!gameRunning || isPaused || isGameOver) {
        gameLoopId = requestAnimationFrame(gameLogicLoop);
        return;
    }
    if (!isFrozen && timestamp - lastDropTime > dropInterval) {
        lastDropTime = timestamp;
        if (!movePiece(0, 1)) { lockPiece(); clearLines(); spawnPiece(); }
    }
    gameLoopId = requestAnimationFrame(gameLogicLoop);
}
function renderLoop() {
    draw();
    animFrameId = requestAnimationFrame(renderLoop);
}

function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (isFrozen) {
        ctx.fillStyle = 'rgba(116,185,255,0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.strokeStyle = 'rgba(0,212,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * BLOCK_SIZE, 0); ctx.lineTo(i * BLOCK_SIZE, canvas.height); ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath(); ctx.moveTo(0, i * BLOCK_SIZE); ctx.lineTo(canvas.width, i * BLOCK_SIZE); ctx.stroke();
    }
    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
            if (board[row][col]) drawBlock(ctx, col, row, board[row][col], false, boardSpecial[row][col]);
        }
    }
    if (currentPiece) {
        const shape = getShape(currentPiece);
        let ghostY = currentPiece.y;
        while (isValidPosition(currentPiece.x, ghostY + 1, currentPiece.rotation)) ghostY++;
        ctx.globalAlpha = 0.12;
        for (let row = 0; row < shape.length; row++) {
            for (let col = 0; col < shape[row].length; col++) {
                if (shape[row][col]) drawBlock(ctx, currentPiece.x + col, ghostY + row, currentPiece.color, true);
            }
        }
        ctx.globalAlpha = 1;
        for (let row = 0; row < shape.length; row++) {
            for (let col = 0; col < shape[row].length; col++) {
                if (shape[row][col]) {
                    drawBlock(ctx, currentPiece.x + col, currentPiece.y + row, currentPiece.color, false, currentPiece.special);
                }
            }
        }
    }
    particleSys.update();
    particleSys.draw(ctx);
    if (isFrozen) {
        ctx.fillStyle = 'rgba(116,185,255,0.7)';
        ctx.font = 'bold 16px Microsoft YaHei';
        ctx.textAlign = 'center';
        ctx.fillText('\u2744 冰冻中', canvas.width/2, 26);
    }
}

function drawBlock(context, x, y, color, isGhost, special) {
    const px = x * BLOCK_SIZE, py = y * BLOCK_SIZE, size = BLOCK_SIZE - 2;
    if (isGhost) {
        context.strokeStyle = color; context.lineWidth = 2;
        context.strokeRect(px + 2, py + 2, size - 2, size - 2);
        return;
    }
    context.fillStyle = color;
    context.fillRect(px + 1, py + 1, size, size);
    context.fillStyle = 'rgba(255,255,255,0.3)';
    context.fillRect(px + 1, py + 1, size, 4);
    context.fillRect(px + 1, py + 1, 4, size);
    context.fillStyle = 'rgba(0,0,0,0.3)';
    context.fillRect(px + 1, py + size - 3, size, 3);
    context.fillRect(px + size - 3, py + 1, 3, size);
    if (special) {
        context.font = '14px Arial';
        context.textAlign = 'center'; context.textBaseline = 'middle';
        context.fillText(special.symbol, px + BLOCK_SIZE/2, py + BLOCK_SIZE/2);
    }
}

function drawNext() {
    nextCtx.fillStyle = '#0a0a1a';
    nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextPieceName) return;
    const pieceData = SHAPES[nextPieceName];
    const shape = pieceData.shapes[0];
    const color = nextPieceSpecial ? nextPieceSpecial.color : pieceData.color;
    const blockSize = 18;
    const offsetX = (nextCanvas.width - shape[0].length * blockSize) / 2;
    const offsetY = (nextCanvas.height - shape.length * blockSize) / 2;
    for (let row = 0; row < shape.length; row++) {
        for (let col = 0; col < shape[row].length; col++) {
            if (shape[row][col]) {
                const px = offsetX + col * blockSize, py = offsetY + row * blockSize, size = blockSize - 2;
                nextCtx.fillStyle = color; nextCtx.fillRect(px, py, size, size);
                nextCtx.fillStyle = 'rgba(255,255,255,0.3)'; nextCtx.fillRect(px, py, size, 3); nextCtx.fillRect(px, py, 3, size);
                nextCtx.fillStyle = 'rgba(0,0,0,0.3)'; nextCtx.fillRect(px, py + size - 2, size, 2); nextCtx.fillRect(px + size - 2, py, 2, size);
                if (nextPieceSpecial) {
                    nextCtx.font = '12px Arial'; nextCtx.textAlign = 'center'; nextCtx.textBaseline = 'middle';
                    nextCtx.fillText(nextPieceSpecial.symbol, px + blockSize/2, py + blockSize/2);
                }
            }
        }
    }
}

// ========================================================================
// 游戏结束 & 保存成绩
// ========================================================================
async function gameOver() {
    isGameOver = true; gameRunning = false;
    AudioSys.stopBGM();
    AudioSys.sfxGameOver();
    overlayTitle.textContent = '游戏结束';
    finalScoreEl.textContent = score;
    startBtn.textContent = '重新开始';
    overlay.classList.remove('hidden');
    pauseBtn.textContent = '暂停';

    document.getElementById('goScore').textContent = score;
    document.getElementById('goLevel').textContent = level;
    document.getElementById('goLines').textContent = lines;
    renderLeaderboard('goLeaderboard', score);
    document.getElementById('gameOverModal').classList.remove('hidden');

    // 自动尝试提交到云端
    const name = LocalBoard.getPlayerName() || '匿名玩家';
    const entry = { name, score, lines, level };
    if (onlineMode) {
        await submitScoreOnline(entry);
    }
    LocalBoard.add(entry);
}

function togglePause() {
    if (isGameOver) return;
    isPaused = !isPaused;
    if (isPaused) {
        pauseBtn.textContent = '继续';
        overlayTitle.textContent = '暂停';
        finalScoreEl.textContent = score;
        startBtn.textContent = '继续';
        overlay.classList.remove('hidden');
    } else {
        pauseBtn.textContent = '暂停';
        overlay.classList.add('hidden');
        lastDropTime = performance.now();
    }
}

function initGame() {
    createBoard();
    score = 0; lines = 0; level = 1;
    dropInterval = 1000; lastDropTime = performance.now();
    isPaused = false; isGameOver = false; gameRunning = true;
    isFrozen = false; energy = 0; combo = 0;
    particleSys.clear();
    if (frozenTimer) clearTimeout(frozenTimer);
    if (comboTimer) clearTimeout(comboTimer);
    updateUI();
    pauseBtn.textContent = '暂停';
    overlay.classList.add('hidden');
    document.getElementById('gameOverModal').classList.add('hidden');

    nextPieceName = getRandomPiece();
    nextPieceSpecial = Math.random() < getSpecialChance() ? getRandomSpecial() : null;
    spawnPiece();

    AudioSys.init();
    AudioSys.startBGM();

    if (gameLoopId) cancelAnimationFrame(gameLoopId);
    if (animFrameId) cancelAnimationFrame(animFrameId);
    gameLoopId = requestAnimationFrame(gameLogicLoop);
    animFrameId = requestAnimationFrame(renderLoop);
}

// ========================================================================
// 事件绑定
// ========================================================================
document.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    switch (e.key) {
        case 'ArrowLeft': case 'a': case 'A': movePiece(-1, 0); break;
        case 'ArrowRight': case 'd': case 'D': movePiece(1, 0); break;
        case 'ArrowDown': case 's': case 'S':
            if (movePiece(0, 1)) { score += 1; updateUI(); } break;
        case 'ArrowUp': case 'w': case 'W': rotatePiece(); break;
        case ' ': hardDrop(); break;
        case 'p': case 'P': togglePause(); break;
        case 'z': case 'Z': useSkillBomb(); break;
        case 'x': case 'X': useSkillFreeze(); break;
        case 'c': case 'C': useSkillGravity(); break;
    }
});

startBtn.addEventListener('click', () => {
    if (isPaused && !isGameOver) togglePause();
    else initGame();
});
pauseBtn.addEventListener('click', togglePause);
document.getElementById('skillBomb').addEventListener('click', useSkillBomb);
document.getElementById('skillFreeze').addEventListener('click', useSkillFreeze);
document.getElementById('skillGravity').addEventListener('click', useSkillGravity);

document.getElementById('audioBtnTop').addEventListener('click', () => {
    const on = AudioSys.toggle();
    document.getElementById('audioBtnTop').textContent = on ? '🔊 音效' : '🔇 音效';
});
document.getElementById('shareBtnTop').addEventListener('click', shareGame);
document.getElementById('rankBtnTop').addEventListener('click', () => {
    renderLeaderboard('leaderboardList');
    document.getElementById('rankModal').classList.remove('hidden');
});

document.getElementById('closeRank').addEventListener('click', () => {
    document.getElementById('rankModal').classList.add('hidden');
});
document.getElementById('closeShare').addEventListener('click', () => {
    document.getElementById('shareModal').classList.add('hidden');
});
document.getElementById('copyLinkBtn').addEventListener('click', copyShareLink);
document.getElementById('nativeShareBtn').addEventListener('click', () => {
    const shareUrl = document.getElementById('shareLinkInput').value;
    if (navigator.share) {
        navigator.share({ title: '超级俄罗斯方块', text: '来挑战我的纪录吧！', url: shareUrl });
    } else {
        copyShareLink();
    }
});

document.getElementById('saveNameBtn').addEventListener('click', () => {
    const name = document.getElementById('playerNameInput').value.trim();
    if (name) LocalBoard.setPlayerName(name);
    renderLeaderboard('leaderboardList');
});

document.getElementById('goRestartBtn').addEventListener('click', () => {
    document.getElementById('gameOverModal').classList.add('hidden');
    initGame();
});
document.getElementById('goShareBtn').addEventListener('click', shareGame);
document.getElementById('goSaveBtn').addEventListener('click', async () => {
    const name = document.getElementById('goNameInput').value.trim() || LocalBoard.getPlayerName() || '匿名玩家';
    LocalBoard.setPlayerName(name);
    const entry = { name, score, lines, level };
    LocalBoard.add(entry);
    if (onlineMode) await submitScoreOnline(entry);
    renderLeaderboard('goLeaderboard', score);
    document.getElementById('goNameInput').value = name;
    const btn = document.getElementById('goSaveBtn');
    btn.textContent = onlineMode ? '✓ 已保存到云端' : '✓ 已保存';
    setTimeout(() => btn.textContent = '保存', 2000);
});

['rankModal','shareModal'].forEach(id => {
    document.getElementById(id).addEventListener('click', (e) => {
        if (e.target.id === id) e.target.classList.add('hidden');
    });
});

// ========================================================================
// 移动端触摸控制
// ========================================================================
let lastActionTime = 0;
const ACTION_DEBOUNCE = 100; // ms，防止 pointerdown + touchstart 同时触发

function handleMobileAction(action) {
    const now = Date.now();
    if (now - lastActionTime < ACTION_DEBOUNCE) return;
    lastActionTime = now;
    if (!gameRunning || isGameOver) return;
    switch (action) {
        case 'left': movePiece(-1, 0); break;
        case 'right': movePiece(1, 0); break;
        case 'down': if (movePiece(0, 1)) { score += 1; updateUI(); } break;
        case 'rotate': rotatePiece(); break;
        case 'drop': hardDrop(); break;
        case 'skill-bomb': useSkillBomb(); break;
        case 'skill-freeze': useSkillFreeze(); break;
        case 'skill-gravity': useSkillGravity(); break;
    }
}

const mobileControls = document.getElementById('mobileControls');

// pointerdown 同时支持触摸和鼠标，无 300ms 延迟
mobileControls.addEventListener('pointerdown', (e) => {
    const el = e.target.nodeType === 3 ? e.target.parentElement : e.target;
    const btn = el.closest('.mob-btn');
    if (!btn) return;
    e.preventDefault();
    handleMobileAction(btn.dataset.action);
    btn.style.transform = 'scale(0.9)';
    setTimeout(() => btn.style.transform = '', 80);
});

// click 作为桌面鼠标后备
mobileControls.addEventListener('click', (e) => {
    const el = e.target.nodeType === 3 ? e.target.parentElement : e.target;
    const btn = el.closest('.mob-btn');
    if (!btn) return;
    handleMobileAction(btn.dataset.action);
});

// Canvas 响应式
function resizeCanvas() {
    const isMobile = window.innerWidth <= 600;
    if (isMobile) {
        const maxW = Math.min(window.innerWidth - 16, 300);
        canvas.style.width = maxW + 'px';
        canvas.style.height = (maxW * 2) + 'px';
    } else {
        canvas.style.width = '300px';
        canvas.style.height = '600px';
    }
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
